<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Notes Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Keep your thoughts organised, one note at a time.</p>
    </header>

    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>

      <form id="note-form">
        <label for="title-input">Note title</label>
        <input
          type="text"
          id="title-input"
          name="title"
          maxlength="100"
          required
          placeholder="Enter a title"
        >

        <label for="body-input">Note body (optional)</label>
        <textarea
          id="body-input"
          name="body"
          rows="4"
          placeholder="Write your note here..."
        ></textarea>

        <button type="submit" id="submit-btn">Create note</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>

      <button type="button" id="load-btn">Load notes</button>

      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to fetch notes from the server.
      </p>

      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
